<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>sidedash</title>
    <link rel="stylesheet" href="./src/app.css" />
  </head>
  <body>
    <div class="header">
      <div class="header-title">내 프로젝트 (<span id="project-count">0</span>)</div>
      <div>
        <button id="toggle-servers" class="toggle-servers-btn" title="실행 중인 서버">🖥</button>
        <button id="add-project" class="add-btn">＋</button>
      </div>
    </div>
    <div id="project-list"></div>
    <div id="server-view">
      <div class="server-view-header">
        <button id="server-back" class="server-back-btn" title="뒤로가기">←</button>
        실행 중인 서버
      </div>
      <div id="server-list"></div>
    </div>
    <div id="detail-view">
      <div class="detail-view-header">
        <button id="detail-back" class="server-back-btn" title="뒤로가기">←</button>
        <span id="detail-view-title">프로젝트</span>
      </div>
      <div id="detail-view-body"></div>
    </div>
    <div class="footer">
      <button id="quit-app" class="quit-btn">종료</button>
      <span id="dev-badge" class="dev-badge"></span>
    </div>
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
