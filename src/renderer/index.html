<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>sidedash</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: #1a1a2e;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        color: #e8e8f0;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px 10px;
        flex-shrink: 0;
      }
      .header-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .add-btn {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: #2c2c46;
        border: none;
        color: #c8c8dd;
        font-size: 15px;
        cursor: pointer;
        transition: background-color 0.1s ease;
      }
      .add-btn:hover {
        background: #35355a;
      }
      .toggle-servers-btn {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: #2c2c46;
        border: none;
        color: #c8c8dd;
        font-size: 13px;
        cursor: pointer;
        transition: background-color 0.1s ease;
        margin-right: 6px;
      }
      .toggle-servers-btn:hover {
        background: #35355a;
      }
      #server-view {
        display: none;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
      }
      body.server-mode #server-view {
        display: flex;
      }
      body.server-mode #project-list {
        display: none;
      }
      .server-view-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 18px 8px;
        flex-shrink: 0;
        font-size: 13px;
        font-weight: 700;
      }
      .server-back-btn {
        border: none;
        background: none;
        cursor: pointer;
        color: #c8c8dd;
        font-size: 16px;
        padding: 0;
        line-height: 1;
      }
      .server-back-btn:hover {
        color: #fff;
      }
      #server-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 14px 14px;
      }
      .server-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border-radius: 8px;
        cursor: pointer;
      }
      .server-row:hover {
        background: #20203a;
      }
      .server-row-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }
      .server-row-meta {
        flex-shrink: 0;
        color: #6fc9d6;
        font-size: 12px;
      }
      .server-row-kill {
        flex-shrink: 0;
        border: none;
        background: none;
        cursor: pointer;
        color: #7a7a9a;
        font-size: 12px;
        padding: 4px 6px;
        border-radius: 6px;
      }
      .server-row-kill:hover {
        color: #e57373;
        background: #2c2c46;
      }
      .server-row-kill:disabled {
        cursor: default;
        color: #5a5a75;
      }
      #project-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 14px 14px;
      }
      .card {
        display: flex;
        gap: 12px;
        padding: 16px 8px;
        border-radius: 10px;
        box-sizing: border-box;
        border: 1px solid transparent;
        transition: background-color 0.1s ease;
      }
      .card.expanded-style {
        background: #22223a;
        border-color: #35355a;
      }
      .card-icon {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: #2c2c46;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 16px;
        color: #c8c8dd;
      }
      .card-icon.icon-pipeline {
        color: #8b8bd8;
        font-family: Menlo, monospace;
        font-weight: 700;
        font-size: 15px;
      }
      .card-icon.icon-pdf {
        color: #8bd8b8;
      }
      .card-body {
        flex: 1;
        min-width: 0;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .card-title {
        font-size: 14px;
        font-weight: 600;
        color: #f0f0f5;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }
      .card-detail {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        font-size: 12px;
        color: #9a9ab8;
        margin-top: 6px;
      }
      .card-detail.missing {
        color: #e05858;
      }
      .card-detail-main {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .card-detail-date {
        flex-shrink: 0;
        color: #6a6a85;
        font-size: 11px;
      }
      .card-dirty-toggle {
        font-size: 12px;
        color: #e0a458;
        margin-top: 4px;
      }
      .card-branch {
        color: #6fc9d6;
        font-weight: 600;
      }
      .card-last-run {
        font-size: 11px;
        color: #7a7a95;
        margin-top: 3px;
      }
      .card-action {
        border: none;
        background: #5b5be0;
        color: #fff;
        cursor: pointer;
        font-size: 10px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 7px;
        white-space: nowrap;
        transition: filter 0.1s ease;
      }
      .card-action:hover:not(.card-action-running) {
        filter: brightness(1.12);
      }
      .card-action-running {
        background: #3a3a5c;
        color: #9a9ab8;
        cursor: default;
      }
      .card-links {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-top: 4px;
        margin-left: -5px;
      }
      .card-link {
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: none;
        cursor: pointer;
        color: #8a8aae;
        padding: 5px;
        border-radius: 6px;
        line-height: 1;
        transition: color 0.1s ease, background-color 0.1s ease;
      }
      .card-link:hover {
        color: #d0d0e8;
        background: #2c2c46;
      }
      .card-remove {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 13px;
        color: #7a7a9a;
        padding: 6px;
        border-radius: 6px;
        line-height: 1;
        transition: color 0.1s ease, background-color 0.1s ease;
      }
      .card-remove:hover {
        color: #d8d8e8;
        background: #2c2c46;
      }
      .card-analyze-row {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .card-action.card-action-secondary {
        background: rgba(111, 201, 214, 0.12);
        color: #6fc9d6;
        border: 1px solid rgba(111, 201, 214, 0.4);
      }
      .card-custom-actions {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .card-custom-action {
        border: 1px solid #4a4a6a;
        background: #262640;
        color: #c8c8e0;
        cursor: pointer;
        font-size: 10px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 7px;
        white-space: nowrap;
        transition: background-color 0.1s ease;
      }
      .card-custom-action:hover:not(.card-action-running) {
        background: #30304e;
      }
      .card-custom-action-manage {
        color: #9a9ab8;
        border-style: dashed;
        background: none;
      }
      .args-prompt input {
        width: 100%;
        box-sizing: border-box;
        background: #22223a;
        border: 1.5px solid #4a4a6a;
        border-radius: 6px;
        color: #e0e0f0;
        font-size: 11px;
        padding: 6px 8px;
        font-family: Menlo, Consolas, monospace;
        margin-bottom: 8px;
      }
      .args-prompt input:focus {
        outline: none;
        border-color: #5b5be0;
      }
      #action-view {
        display: none;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
      }
      body.action-mode #action-view {
        display: flex;
      }
      body.action-mode #project-list {
        display: none;
      }
      .action-view-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 18px 8px;
        flex-shrink: 0;
        font-size: 13px;
        font-weight: 700;
      }
      #action-view-body {
        flex: 1;
        overflow-y: auto;
        padding: 4px 16px 16px;
      }
      .action-item {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 2px;
        border-bottom: 1px solid #26263f;
      }
      .action-item:last-of-type {
        border-bottom: none;
      }
      .action-item-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .action-item-label {
        font-weight: 600;
        color: #e0e0f0;
      }
      .action-item-command {
        font-family: Menlo, Consolas, monospace;
        font-size: 11px;
        color: #8a8aae;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .action-item-command.auto {
        font-style: italic;
        color: #6a6a85;
      }
      .action-item-buttons {
        display: flex;
        gap: 2px;
        flex-shrink: 0;
      }
      .action-item-buttons button {
        border: none;
        background: none;
        cursor: pointer;
        color: #7a7a9a;
        font-size: 12px;
        padding: 3px 6px;
        border-radius: 5px;
      }
      .action-item-buttons button:hover {
        color: #d8d8e8;
        background: #2c2c46;
      }
      .action-add-new {
        display: block;
        width: 100%;
        margin-top: 12px;
        padding: 9px;
        border: 1px dashed #45456a;
        background: none;
        color: #9a9ab8;
        font-size: 12px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
      }
      .action-add-new:hover {
        background: #20203a;
        color: #c8c8dd;
      }
      .action-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-top: 4px;
      }
      .action-form-field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .action-form-field label {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8a8aae;
        font-weight: 600;
      }
      .action-form-field input {
        box-sizing: border-box;
        width: 100%;
        background: #22223a;
        border: 1.5px solid #4a4a6a;
        border-radius: 6px;
        color: #e0e0f0;
        font-size: 12px;
        padding: 7px 9px;
        font-family: inherit;
      }
      .action-form-field input.mono {
        font-family: Menlo, Consolas, monospace;
        font-size: 11px;
      }
      .action-form-field input:focus {
        outline: none;
        border-color: #5b5be0;
      }
      .action-form-suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 6px;
      }
      .action-form-suggestion-chip {
        border: 1px solid #4a4a6a;
        background: #20203a;
        color: #a0a0c0;
        font-family: Menlo, Consolas, monospace;
        font-size: 10px;
        padding: 3px 8px;
        border-radius: 999px;
        cursor: pointer;
      }
      .action-form-suggestion-chip:hover {
        background: #2c2c46;
        color: #d8d8e8;
      }
      .action-form-hint {
        font-size: 10px;
        color: #6a6a85;
      }
      .action-form-check {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 12px;
        color: #b5b5d0;
        cursor: pointer;
      }
      .action-form-check code {
        font-family: Menlo, Consolas, monospace;
        background: #22223a;
        padding: 0 3px;
        border-radius: 3px;
      }
      .action-form-buttons {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .action-form-save {
        font-size: 12px;
        font-weight: 600;
        padding: 7px 16px;
        background: #5b5be0;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: filter 0.1s ease;
      }
      .action-form-save:disabled {
        background: #3a3a5c;
        color: #9a9ab8;
        cursor: default;
      }
      .action-form-save:not(:disabled):hover {
        filter: brightness(1.12);
      }
      .action-form-cancel {
        font-size: 12px;
        padding: 7px 16px;
        background: none;
        color: #9a9ab8;
        border: none;
        cursor: pointer;
        border-radius: 8px;
      }
      .action-form-cancel:hover {
        color: #d8d8e8;
      }
      .target-select {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed #3a3a5c;
        font-size: 12px;
        color: #b5b5d0;
        line-height: 1.7;
      }
      .target-select-hint {
        color: #8a8aae;
        margin-bottom: 6px;
      }
      .target-select-preview {
        margin-top: 8px;
        padding: 6px 8px;
        background: #22223a;
        border-radius: 6px;
        font-family: Menlo, Consolas, monospace;
        font-size: 11px;
        color: #8bd8b8;
        white-space: nowrap;
        overflow-x: auto;
      }
      .target-select label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        color: #d0d0e0;
        cursor: pointer;
      }
      .target-select input[type='checkbox'],
      .action-form-check input[type='checkbox'] {
        appearance: none;
        -webkit-appearance: none;
        width: 15px;
        height: 15px;
        margin: 0;
        border: 1.5px solid #4a4a6a;
        border-radius: 4px;
        background: #22223a;
        cursor: pointer;
        position: relative;
        flex-shrink: 0;
      }
      .target-select input[type='checkbox']:checked,
      .action-form-check input[type='checkbox']:checked {
        background: #5b5be0;
        border-color: #5b5be0;
      }
      .target-select input[type='checkbox']:checked::after,
      .action-form-check input[type='checkbox']:checked::after {
        content: '';
        position: absolute;
        left: 4px;
        top: 0px;
        width: 4px;
        height: 8px;
        border: solid #fff;
        border-width: 0 1.5px 1.5px 0;
        transform: rotate(45deg);
      }
      /* Aligns the checkbox with the first line of its (possibly wrapping)
         label text — .action-form-check uses align-items: flex-start since
         that label text can wrap to two lines, unlike target-select's. */
      .action-form-check input[type='checkbox'] {
        margin-top: 2px;
      }
      .target-select-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .target-select-run {
        font-size: 11px;
        font-weight: 600;
        padding: 5px 12px;
        background: #5b5be0;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: filter 0.1s ease;
      }
      .target-select-run:hover {
        filter: brightness(1.12);
      }
      .target-select-cancel {
        font-size: 11px;
        padding: 5px 12px;
        background: none;
        color: #9a9ab8;
        border: none;
        cursor: pointer;
        border-radius: 8px;
        transition: color 0.1s ease;
      }
      .target-select-cancel:hover {
        color: #d8d8e8;
      }
      .divider {
        height: 1px;
        background: #2c2c46;
        margin: 2px 6px;
      }
      .empty-state {
        padding: 24px 18px;
        text-align: center;
        color: #9a9ab8;
        font-size: 13px;
      }
      .footer {
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 18px;
        border-top: 1px solid #2c2c46;
      }
      .quit-btn {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 12px;
        color: #9a9ab8;
        text-align: left;
        padding: 2px 0;
        transition: color 0.1s ease;
      }
      .quit-btn:hover {
        color: #d8d8e8;
      }
      .dev-badge {
        font-size: 10px;
        color: #6a6a85;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-title">내 프로젝트 (<span id="project-count">0</span>)</div>
      <div>
        <button id="toggle-servers" class="toggle-servers-btn" title="실행 중인 서버">🖥</button>
        <button id="add-project" class="add-btn">＋</button>
      </div>
    </div>
    <div id="project-list"></div>
    <div id="server-view">
      <div class="server-view-header">
        <button id="server-back" class="server-back-btn" title="뒤로가기">←</button>
        실행 중인 서버
      </div>
      <div id="server-list"></div>
    </div>
    <div id="action-view">
      <div class="action-view-header">
        <button id="action-back" class="server-back-btn" title="뒤로가기">←</button>
        <span id="action-view-title">액션</span>
      </div>
      <div id="action-view-body"></div>
    </div>
    <div class="footer">
      <button id="quit-app" class="quit-btn">종료</button>
      <span id="dev-badge" class="dev-badge"></span>
    </div>
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
