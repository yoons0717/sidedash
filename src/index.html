<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>sidedash</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
      }
      .card {
        padding: 8px 0;
        border-bottom: 1px solid #e0e0e0;
      }
      .card-title {
        font-weight: 600;
      }
      .card-detail {
        color: #666;
        font-size: 12px;
        margin-top: 2px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        cursor: pointer;
      }
      .card-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .add-btn,
      .card-remove {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 14px;
        color: #666;
      }
      .card-action {
        border: none;
        background: #eef2ff;
        color: #3949ab;
        cursor: pointer;
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 10px;
        white-space: nowrap;
      }
      .card-action-running {
        background: #f0f0f0;
        color: #999;
        cursor: default;
      }
      .card-expanded {
        margin-top: 4px;
        padding-top: 4px;
        border-top: 1px dashed #e0e0e0;
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div>내 프로젝트 (<span id="project-count">0</span>)</div>
      <button id="add-project" class="add-btn">＋</button>
    </div>
    <div id="project-list"></div>
    <script src="renderer/app.js"></script>
  </body>
</html>
