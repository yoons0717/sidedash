<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>sidedash</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: #1a1a2e;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        color: #e8e8f0;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px 10px;
        flex-shrink: 0;
      }
      .header-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .add-btn {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: #2c2c46;
        border: none;
        color: #c8c8dd;
        font-size: 15px;
        cursor: pointer;
        transition: background-color 0.1s ease;
      }
      .add-btn:hover {
        background: #35355a;
      }
      #project-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 14px 14px;
      }
      .card {
        display: flex;
        gap: 12px;
        padding: 16px 8px;
        border-radius: 10px;
        box-sizing: border-box;
        border: 1px solid transparent;
        cursor: pointer;
        transition: background-color 0.1s ease;
      }
      .card:hover {
        background: #20203a;
      }
      .card.expanded-style {
        background: #22223a;
        border-color: #35355a;
      }
      .card-icon {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: #2c2c46;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 16px;
        color: #c8c8dd;
      }
      .card-icon.icon-pipeline {
        color: #8b8bd8;
        font-family: Menlo, monospace;
        font-weight: 700;
        font-size: 15px;
      }
      .card-icon.icon-pdf {
        color: #8bd8b8;
      }
      .card-body {
        flex: 1;
        min-width: 0;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .card-title {
        font-size: 14px;
        font-weight: 600;
        color: #f0f0f5;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }
      .card-detail {
        font-size: 12px;
        color: #9a9ab8;
        margin-top: 6px;
      }
      .card-detail.dirty {
        color: #e0a458;
      }
      .card-detail.missing {
        color: #e05858;
      }
      .card-action {
        box-sizing: border-box;
        border: 1.5px solid #5b5be0;
        background: transparent;
        color: #9b9bf0;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 8px;
        white-space: nowrap;
        transition: background-color 0.1s ease;
      }
      .card-action:hover:not(.card-action-running) {
        background: rgba(91, 91, 224, 0.18);
      }
      .card-action-running {
        border-color: #3a3a5c;
        background: transparent;
        color: #6f6f8a;
        cursor: default;
      }
      .card-remove {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 13px;
        color: #7a7a9a;
        padding: 6px;
        border-radius: 6px;
        line-height: 1;
        transition: color 0.1s ease, background-color 0.1s ease;
      }
      .card-remove:hover {
        color: #d8d8e8;
        background: #2c2c46;
      }
      .card-expanded,
      .target-select {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed #3a3a5c;
        font-size: 12px;
        color: #b5b5d0;
        line-height: 1.7;
      }
      .target-select label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
        color: #d0d0e0;
      }
      .target-select-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .target-select-run {
        font-size: 11px;
        font-weight: 600;
        padding: 5px 12px;
        background: #5b5be0;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: filter 0.1s ease;
      }
      .target-select-run:hover {
        filter: brightness(1.12);
      }
      .target-select-cancel {
        font-size: 11px;
        padding: 5px 12px;
        background: none;
        color: #9a9ab8;
        border: none;
        cursor: pointer;
        border-radius: 8px;
        transition: color 0.1s ease;
      }
      .target-select-cancel:hover {
        color: #d8d8e8;
      }
      .divider {
        height: 1px;
        background: #2c2c46;
        margin: 2px 6px;
      }
      .footer {
        flex-shrink: 0;
        padding: 10px 18px;
        border-top: 1px solid #2c2c46;
      }
      .quit-btn {
        width: 100%;
        border: none;
        background: none;
        cursor: pointer;
        font-size: 12px;
        color: #9a9ab8;
        text-align: left;
        padding: 2px 0;
        transition: color 0.1s ease;
      }
      .quit-btn:hover {
        color: #d8d8e8;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-title">내 프로젝트 (<span id="project-count">0</span>)</div>
      <button id="add-project" class="add-btn">＋</button>
    </div>
    <div id="project-list"></div>
    <div class="footer">
      <button id="quit-app" class="quit-btn">종료</button>
    </div>
    <script src="renderer/app.js"></script>
  </body>
</html>
