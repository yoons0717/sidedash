<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>sidedash</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
      }
      .card {
        padding: 8px 0;
        border-bottom: 1px solid #e0e0e0;
      }
      .card-title {
        font-weight: 600;
      }
      .card-detail {
        color: #666;
        font-size: 12px;
        margin-top: 2px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .add-btn,
      .card-remove {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 14px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div>내 프로젝트 (<span id="project-count">0</span>)</div>
      <button id="add-project" class="add-btn">＋</button>
    </div>
    <div id="project-list"></div>
    <script src="renderer/app.js"></script>
  </body>
</html>
