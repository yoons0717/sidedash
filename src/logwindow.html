<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>실행 로그</title>
    <style>
      body {
        margin: 0;
        background: #1e1e1e;
        color: #ddd;
      }
      #log {
        margin: 0;
        padding: 12px;
        font-family: Menlo, Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #status {
        padding: 10px 12px;
        font-family: Menlo, Consolas, monospace;
        font-size: 12px;
        border-top: 1px solid #444;
      }
      #status.success { color: #7cd992; }
      #status.failure { color: #e57373; }
      #status button {
        margin-left: 10px;
        font-size: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <pre id="log"></pre>
    <div id="status"></div>
    <script>
      const { ipcRenderer, shell } = require('electron');
      const logEl = document.getElementById('log');
      const statusEl = document.getElementById('status');

      function appendText(text) {
        logEl.appendChild(document.createTextNode(text));
        window.scrollTo(0, document.body.scrollHeight);
      }

      ipcRenderer.on('log-data', (event, chunk) => {
        appendText(chunk);
      });

      ipcRenderer.on('log-exit', (event, { code, path, actionType }) => {
        if (code === 0) {
          statusEl.className = 'success';
          statusEl.textContent = '완료';

          const folder = actionType === 'pipeline' ? `${path}/notes` : `${path}/pdf-output`;
          const label = actionType === 'pipeline' ? '노트 열기' : 'PDF 폴더 열기';

          const button = document.createElement('button');
          button.textContent = label;
          button.onclick = () => {
            shell.openPath(folder).then((errorMessage) => {
              if (errorMessage) {
                appendText(`\n폴더를 열 수 없습니다: ${errorMessage}\n`);
              }
            });
          };
          statusEl.appendChild(button);
        } else {
          statusEl.className = 'failure';
          statusEl.textContent =
            code === null ? '실패 (프로세스를 시작하지 못함)' : `실패 (종료 코드 ${code})`;
        }
      });
    </script>
  </body>
</html>
